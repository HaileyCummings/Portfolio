<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hailey Cummings</title>
  <meta name="description" content="Project management and AI engineering. Site under construction.">
  <style>
    :root {
      --ground: #f4efe6;
      --ink: #1d1b19;
      --accent: #b4432b;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #181614; --ink: #f1ebe0; --accent: #e0775c; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--ground);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { max-width: 36rem; }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      line-height: 1;
      font-weight: 400;
      text-wrap: balance;
    }
    p { margin: 0; font-size: 1.125rem; line-height: 1.5; }
    .line { color: var(--accent); }
    main > * {
      opacity: 0;
      transform: translateY(8px);
      animation: in 400ms var(--ease-out) forwards;
    }
    main > p { animation-delay: 80ms; }
    @keyframes in { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      main > * { animation: none; opacity: 1; transform: none; }
    }
    ::selection { background: var(--accent); color: var(--ground); }
  </style>
</head>
<body>
  <main>
    <h1>Hailey Cummings</h1>
    <p>Project management <span class="line">meets</span> AI engineering. The full site is on its way.</p>
  </main>
</body>
</html>
